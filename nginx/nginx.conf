# Reverse-proxy перед uvicorn. server_name _ — любой Host
# (реальный URL телефонов задаётся PUBLIC_BASE_URL, не здесь).
# X-Forwarded-For = $remote_addr (один hop), lockout в auth.py не обмануть цепочкой.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/ssl/ncdc.crt;
    ssl_certificate_key /etc/nginx/ssl/ncdc.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag noindex always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://ncdc:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
