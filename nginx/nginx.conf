server {
    listen 443 ssl;
    http2 on;
    server_name ncdc-dev.bsmuk.ru;

    # Пути к сертификатам внутри контейнера nginx
    ssl_certificate /etc/nginx/ssl/ncdc-dev.crt;
    ssl_certificate_key /etc/nginx/ssl/ncdc-dev.key;

    # Безопасные настройки SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Проксирование на FastAPI
    location / {
        proxy_pass http://ncdc:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Для ActionURL и длительных запросов
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# Перенаправление HTTP на HTTPS
server {
    listen 80;
    server_name ncdc-dev.bsmuk.ru;
    return 301 https://$host$request_uri;
}