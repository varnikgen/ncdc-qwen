<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NCDC{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background-color: #343a40; color: white; }
        .sidebar a { color: #cfd8dc; text-decoration: none; padding: 10px 15px; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: #495057; color: white; }
        .sidebar .nav-header { font-size: 0.75rem; text-transform: uppercase; color: #adb5bd; padding: 15px 15px 5px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-center border-bottom border-secondary">
                    <h4 class="m-0">NCDC</h4>
                    <small class="text-muted">v{{ request.app.version }}</small>
                </div>
                <nav class="mt-3">
                    <a href="/" class="{% if request.url.path == '/' %}active{% endif %}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                    
                    <div class="nav-header">Device Management</div>
                    <a href="/phones"><i class="bi bi-telephone me-2"></i> Device List</a>
                    
                    <div class="nav-header">Account Management</div>
                    <a href="/accounts"><i class="bi bi-person-badge me-2"></i> Account List</a>
                    
                    <div class="nav-header">Device Configuration</div>
                    <a href="/settings/global"><i class="bi bi-gear me-2"></i> Global Config</a>
                    <a href="/settings/models"><i class="bi bi-phone me-2"></i> Model Config</a>
                    
                    <div class="nav-header">System</div>
                    <a href="/audit"><i class="bi bi-journal-text me-2"></i> Audit Log</a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
