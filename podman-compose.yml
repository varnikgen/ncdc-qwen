version: '3.8'

services:
  ncdc:
    build: .
    container_name: ncdc
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/ncdc.db
      - HOST=0.0.0.0
      - PORT=8000
      - PROVISIONING_BASE_URL=https://ncdc.bsmuk.ru/yealink/
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3