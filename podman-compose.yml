version: '3.8'

services:
  ncdc:
    build: .
    container_name: ncdc-app
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/ncdc.db
      - HOST=0.0.0.0
      - PORT=8000
      - PROVISIONING_BASE_URL=https://ncdc-dev.bsmuk.ru/provision/
    restart: unless-stopped
    networks:
      - ncdc-network

  nginx:
    image: nginx:alpine
    container_name: ncdc-nginx
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - ncdc
    restart: unless-stopped
    networks:
      - ncdc-network

networks:
  ncdc-network:
    driver: bridge